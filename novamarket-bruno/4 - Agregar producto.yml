info:
  name: 4 - Agregar producto
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/cart/items"
  body:
    type: json
    data: |-
      {
        "productId": 1,
        "quantity": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
